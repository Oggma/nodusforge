name: Build artifacts

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Build all platforms or one platform
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

permissions:
  contents: read

jobs:
  linux:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - run: npm ci
      - run: npm run build:app
      - name: Normalize artifacts
        run: |
          mkdir -p artifacts/linux
          cp -a release-assets/v*/platforms/linux/. artifacts/linux/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/linux/
          if-no-files-found: error

  windows:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run build:app
      - name: Normalize artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          Copy-Item release-assets\v*\platforms\windows\* artifacts\windows -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/windows/
          if-no-files-found: error

  macos:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - run: npm ci
      - run: npm run build:app
      - name: Normalize artifacts
        run: |
          mkdir -p artifacts/macos
          cp -a release-assets/v*/platforms/macos/. artifacts/macos/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/macos/
          if-no-files-found: error
